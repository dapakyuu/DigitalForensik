<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Riwayat - Forensa</title>
    <link rel="icon" type="image/png" href="assets/logo.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
    <style>
      /* Gaya Khusus untuk Tombol Cetak */
      .btn-print {
        background: #fff;
        color: #4f46e5;
        border: 1px solid #e6e8f0;
        border-radius: 8px;
        padding: 8px 16px;
        font-size: 13.5px;
        font-weight: 600;
        cursor: pointer;
        transition: background 0.2s;
      }
      .btn-print:hover {
        background: #eef0fd;
      }

      .history-print-header {
        display: none;
      }

      /* Khusus Print: Menyembunyikan elemen UI yang tidak perlu */
      @media print {
        @page {
          size: A4 landscape;
          margin: 12mm;
        }

        html,
        body {
          height: auto !important;
          min-height: 0 !important;
          margin: 0;
          background: #fff;
          overflow: visible !important;
          -webkit-print-color-adjust: exact;
          print-color-adjust: exact;
        }

        .mobile-topbar,
        .sidebar-overlay,
        .sidebar,
        .dashboard-header {
          display: none !important;
        }

        .dashboard-layout,
        .dashboard-main {
          display: block !important;
          width: 100% !important;
          min-height: 0 !important;
          margin: 0 !important;
          padding: 0 !important;
          overflow: visible !important;
        }

        .table-section {
          position: static;
          width: 100%;
          box-sizing: border-box;
          overflow: hidden;
          border: 1px solid #dbe2ea;
          border-radius: 14px;
          background: #fff;
          box-shadow: 0 4px 14px rgba(15, 23, 42, 0.08);
          margin: 0;
          padding: 0;
          break-after: avoid-page;
          page-break-after: avoid;
        }

        .table-head {
          padding: 12px 14px;
          border-bottom: 1px solid #e5e7eb;
          background: #f8fafc;
        }

        .history-print-header {
          display: flex;
          align-items: flex-start;
          justify-content: space-between;
          gap: 16px;
          margin: 0 14px;
          padding: 14px 0 12px;
          border-bottom: 2px solid #4f46e5;
        }

        .history-print-brand {
          display: flex;
          align-items: center;
          gap: 10px;
        }

        .history-print-logo {
          width: 38px;
          height: 38px;
          object-fit: contain;
        }

        .history-print-brand strong {
          display: block;
          color: #111827;
          font-size: 15px;
        }

        .history-print-brand span,
        .history-print-date span {
          display: block;
          color: #64748b;
          font-size: 9px;
          text-transform: uppercase;
          letter-spacing: 0.05em;
        }

        .history-print-date {
          text-align: right;
        }

        .history-print-date strong {
          display: block;
          margin-top: 4px;
          color: #111827;
          font-size: 10px;
        }

        .table-head h2 {
          font-size: 16px;
        }

        .table-wrap {
          overflow: hidden;
        }

        /* Sembunyikan tombol cetak saat diprint */
        .btn-print {
          display: none !important;
        }

        .history-toolbar,
        .history-pagination-wrap {
          display: none !important;
        }

        /* Hilangkan kolom AKSI (kolom terakhir) karena tidak berfungsi di kertas */
        th:last-child,
        td:last-child {
          display: none !important;
        }

        /* Penyesuaian agar tabel tidak terpotong */
        table {
          width: 100%;
          border-collapse: collapse;
          font-size: 10px;
        }
        th,
        td {
          padding: 6px 8px !important;
          line-height: 1.2;
          vertical-align: middle;
        }
        th {
          font-size: 9px;
        }
        .history-row-multiple-lines td div {
          margin-top: 2px !important;
          font-size: 8px !important;
          line-height: 1.15;
        }
        .badge {
          padding: 3px 6px;
          font-size: 8px;
        }
        tr {
          page-break-inside: avoid;
        }
      }
    </style>
  </head>
  <body class="dashboard-page">
    <div class="mobile-topbar">
      <button
        type="button"
        class="hamburger-btn"
        id="hamburger-btn"
        aria-label="Buka menu navigasi"
        aria-expanded="false"
        aria-controls="sidebar"
      >
        <svg
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
        >
          <path d="M4 7h16" />
          <path d="M4 12h16" />
          <path d="M4 17h16" />
        </svg>
      </button>
      <div class="sidebar-brand">
        <div class="mini-logo"><img src="assets/logo.png" alt="" /></div>
        <span>Forensa</span>
      </div>
    </div>
    <div class="sidebar-overlay" id="sidebar-overlay"></div>

    <div class="dashboard-layout">
      <aside class="sidebar" id="sidebar">
        <div>
          <div class="sidebar-top-row">
            <div class="sidebar-brand">
              <div class="mini-logo"><img src="assets/logo.png" alt="" /></div>
              <span>Forensa</span>
            </div>
            <button
              type="button"
              class="sidebar-close-btn"
              id="sidebar-close-btn"
              aria-label="Tutup menu navigasi"
            >
              <svg
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
              >
                <path d="M18 6 6 18" />
                <path d="M6 6l12 12" />
              </svg>
            </button>
          </div>

          <nav class="sidebar-nav" id="sidebar-nav">
            <a href="dashboard.html">
              <span class="nav-icon" aria-hidden="true">
                <svg
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2"
                >
                  <rect x="3" y="3" width="7" height="7" rx="1.5"></rect>
                  <rect x="14" y="3" width="7" height="7" rx="1.5"></rect>
                  <rect x="3" y="14" width="7" height="7" rx="1.5"></rect>
                  <rect x="14" y="14" width="7" height="7" rx="1.5"></rect>
                </svg>
              </span>
              Dashboard
            </a>
            <a href="upload.html">
              <span class="nav-icon" aria-hidden="true">
                <svg
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2"
                >
                  <path d="M12 16V4"></path>
                  <path d="M7 9l5-5 5 5"></path>
                  <rect x="4" y="16" width="16" height="4" rx="1.5"></rect>
                </svg>
              </span>
              Upload
            </a>
            <a href="riwayat.html" class="active">
              <span class="nav-icon" aria-hidden="true">
                <svg
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2"
                >
                  <path d="M3 12a9 9 0 1 0 3-6.7"></path>
                  <path d="M3 4v5h5"></path>
                  <path d="M12 7v5l3 2"></path>
                </svg>
              </span>
              Riwayat
            </a>
            <a href="profil.html">
              <span class="nav-icon" aria-hidden="true">
                <svg
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2"
                >
                  <circle cx="12" cy="8" r="4"></circle>
                  <path d="M4 21c0-4.4 3.6-8 8-8s8 3.6 8 8"></path>
                </svg>
              </span>
              Profil
            </a>
          </nav>
        </div>

        <div class="sidebar-bottom">
          <button id="logout-btn" class="logout-btn" type="button">
            <span class="nav-icon" aria-hidden="true">
              <svg
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
              >
                <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
                <path d="M16 17l5-5-5-5"></path>
                <path d="M21 12H9"></path>
              </svg>
            </span>
            Logout
          </button>
        </div>
      </aside>

      <main class="dashboard-main">
        <header class="dashboard-header">
          <div>
            <h1>Riwayat Verifikasi</h1>
            <p>
              Daftar semua dokumen yang pernah dianalisis oleh sistem Forensa.
            </p>
          </div>
        </header>

        <section class="table-section">
          <div class="history-print-header">
            <div class="history-print-brand">
              <img
                class="history-print-logo"
                src="assets/logo.png"
                alt="Logo Forensa"
              />
              <div>
                <strong>Forensa</strong>
                <span>Layanan Verifikasi Dokumen Akademik</span>
              </div>
            </div>
            <div class="history-print-date">
              <span>Tanggal Cetak</span>
              <strong id="history-print-date">-</strong>
            </div>
          </div>
          <div class="table-head">
            <h2>Semua Riwayat</h2>
            <button
              id="btn-print-riwayat"
              type="button"
              class="btn-print"
              onclick="window.print()"
            >
              Cetak / Simpan Laporan
            </button>
          </div>

          <div class="history-toolbar">
            <label class="history-search">
              <span>Cari</span>
              <input
                id="history-search-input"
                type="search"
                placeholder="Cari dokumen, status, jenis PDF, atau tanggal..."
                autocomplete="off"
              />
            </label>
            <label class="history-page-size">
              <span>Baris per halaman</span>
              <select id="history-page-size-select">
                <option value="10" selected>10</option>
                <option value="20">20</option>
                <option value="50">50</option>
              </select>
            </label>
          </div>

          <div class="table-wrap">
            <table class="history-table">
              <thead>
                <tr>
                  <th>NO</th>
                  <th>DOKUMEN</th>
                  <th>TANGGAL</th>
                  <th>KEYAKINAN</th>
                  <th>DIGITAL/SCAN</th>
                  <th>STATUS</th>
                  <th>AKSI</th>
                </tr>
              </thead>
              <tbody id="history-table-body">
                <tr>
                  <td colspan="7" class="table-empty">
                    Memuat data riwayat...
                  </td>
                </tr>
              </tbody>
            </table>
          </div>
          <div class="history-pagination-wrap">
            <p id="history-pagination-info" class="history-pagination-info"></p>
            <nav
              id="history-pagination"
              class="history-pagination"
              aria-label="Navigasi halaman riwayat"
            ></nav>
          </div>
        </section>
      </main>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/jspdf-autotable@3.8.4/dist/jspdf.plugin.autotable.min.js"></script>
    <script src="supabase-config.js"></script>
    <script src="script.js"></script>
  </body>
</html>
