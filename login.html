<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Masuk - Sahih</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body class="auth-page">
    <main class="auth-layout">
      <section class="brand-panel">
        <div class="brand-content">
          <div class="brand-logo">S</div>
          <h1>Sahih</h1>
          <p>Verifikasi Keaslian Dokumen</p>
        </div>
      </section>

      <section class="auth-panel">
        <div class="auth-card fade-in-up">
          <h2>Masuk ke Akun</h2>
          <p class="auth-note">
            Masukkan email dan kata sandi Anda untuk masuk.
          </p>

          <form id="login-form" class="auth-form" novalidate>
            <label class="input-group">
              <span class="input-icon" aria-hidden="true">
                <svg
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2"
                >
                  <path d="M4 6h16v12H4z"></path>
                  <path d="M4 7l8 6 8-6"></path>
                </svg>
              </span>
              <input
                type="email"
                name="email"
                placeholder="Email pribadi"
                required
              />
            </label>

            <label class="input-group">
              <span class="input-icon" aria-hidden="true">
                <svg
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2"
                >
                  <rect x="5" y="11" width="14" height="10" rx="2"></rect>
                  <path d="M8 11V8a4 4 0 0 1 8 0v3"></path>
                </svg>
              </span>
              <input
                type="password"
                name="password"
                placeholder="Kata sandi"
                required
              />
            </label>

            <div class="form-row end">
              <a class="text-link" href="reset-password.html"
                >Lupa kata sandi?</a
              >
            </div>

            <button type="submit" class="primary-btn">Masuk</button>

            <p class="form-footer">
              Belum punya akun?
              <a href="signup.html" class="text-link">Daftar sekarang</a>
            </p>
          </form>
        </div>
      </section>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="supabase-config.js"></script>
    <script src="script.js"></script>
  </body>
</html>
