<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>404 - Halaman Tidak Ditemukan | Forensa</title>
    <meta http-equiv="refresh" content="6; url=/index.html" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --indigo-500: #6366f1;
        --indigo-600: #4f46e5;
        --indigo-700: #4338ca;
        --bg-soft: #f4f6fb;
        --text-main: #0f172a;
        --text-muted: #64748b;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        min-height: 100%;
        font-family: "Plus Jakarta Sans", "Segoe UI", sans-serif;
      }

      body {
        min-height: 100vh;
        display: grid;
        place-items: center;
        background:
          radial-gradient(
            circle at 20% 20%,
            rgba(99, 102, 241, 0.2),
            transparent 30%
          ),
          radial-gradient(
            circle at 80% 80%,
            rgba(67, 56, 202, 0.2),
            transparent 30%
          ),
          linear-gradient(
            165deg,
            var(--indigo-600) 0%,
            var(--indigo-500) 46%,
            var(--indigo-700) 100%
          );
        color: #fff;
        padding: 24px;
      }

      .error-card {
        width: min(560px, 100%);
        text-align: center;
        padding: 40px 28px;
        border-radius: 28px;
        background: rgba(255, 255, 255, 0.08);
        border: 1px solid rgba(255, 255, 255, 0.16);
        backdrop-filter: blur(10px);
        box-shadow: 0 24px 60px rgba(15, 23, 42, 0.24);
      }

      .logo {
        width: 88px;
        height: 88px;
        margin: 0 auto 28px;
        border-radius: 0;
        display: grid;
        place-items: center;
        background: transparent;
        color: var(--indigo-600);
        font-size: 42px;
        font-weight: 800;
        overflow: visible;
        box-shadow: none;
      }

      .logo img {
        width: 100%;
        height: 100%;
        display: block;
        object-fit: contain;
      }

      .code {
        margin: 0;
        font-size: 18px;
        font-weight: 800;
        letter-spacing: 0.22em;
        color: #c7d2fe;
      }

      h1 {
        margin: 12px 0 10px;
        font-size: clamp(32px, 5vw, 52px);
        line-height: 1.05;
      }

      p {
        margin: 0;
        color: #e0e7ff;
        line-height: 1.7;
        font-size: 16px;
      }

      .actions {
        margin-top: 28px;
        display: flex;
        gap: 12px;
        justify-content: center;
        flex-wrap: wrap;
      }

      .btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-height: 48px;
        padding: 0 18px;
        border-radius: 12px;
        font-weight: 700;
        text-decoration: none;
        transition:
          transform 0.2s ease,
          box-shadow 0.2s ease,
          background 0.2s ease;
      }

      .btn:hover {
        transform: translateY(-1px);
      }

      .btn-primary {
        background: #ffffff;
        color: var(--indigo-600);
        box-shadow: 0 14px 30px rgba(15, 23, 42, 0.18);
      }

      .btn-secondary {
        border: 1px solid rgba(255, 255, 255, 0.28);
        color: #ffffff;
        background: rgba(255, 255, 255, 0.08);
      }

      .hint {
        margin-top: 18px;
        color: #c7d2fe;
        font-size: 13px;
      }

      .countdown {
        margin-top: 8px;
        color: #e0e7ff;
        font-size: 13px;
      }
    </style>
  </head>
  <body>
    <main class="error-card" aria-labelledby="error-title">
      <div class="logo">
        <img src="/assets/logo_putih.png" alt="Logo Forensa" />
      </div>
      <p class="code">404</p>
      <h1 id="error-title">Halaman tidak ditemukan</h1>
      <p>
        URL yang Anda buka tidak tersedia atau sudah dipindahkan. Silakan
        kembali ke halaman utama untuk melanjutkan.
      </p>
      <div class="actions">
        <a class="btn btn-primary" href="/index.html"
          >Kembali ke Landing Page</a
        >
        <a class="btn btn-secondary" href="/index.html#coba">Coba Verifikasi</a>
      </div>
      <div class="hint">
        Jika Anda membuka link lama, periksa kembali alamatnya.
      </div>
      <div class="countdown">
        Anda akan dialihkan ke landing page dalam 6 detik.
      </div>
    </main>
  </body>
</html>
