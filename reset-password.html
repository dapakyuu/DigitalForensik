<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Lupa Password - Forensa</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body class="auth-page">
    <main class="auth-layout signup-layout">
      <section class="brand-panel">
        <div class="brand-content">
          <div class="brand-logo">
            <img src="assets/logo_putih.png" alt="" />
          </div>
          <h1>Forensa</h1>
          <p>Reset password lewat email</p>
        </div>
      </section>

      <section class="auth-panel">
        <div class="auth-card signup-card fade-in-up">
          <h2>Lupa Password</h2>
          <p class="auth-note">
            Masukkan email Anda untuk menerima link reset password.
          </p>

          <form id="reset-request-form" class="auth-form" novalidate>
            <label class="input-group">
              <span class="input-icon" aria-hidden="true">
                <svg
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2"
                >
                  <path d="M4 6h16v12H4z"></path>
                  <path d="M4 7l8 6 8-6"></path>
                </svg>
              </span>
              <input
                type="email"
                name="email"
                placeholder="Email pribadi"
                required
              />
            </label>

            <button type="submit" class="primary-btn">Kirim Link Reset</button>

            <p class="form-footer">
              Kembali ke
              <a href="login.html" class="text-link">login</a>
            </p>
          </form>
        </div>
      </section>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="supabase-config.js"></script>
    <script src="script.js"></script>
  </body>
</html>
