<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Detail Riwayat - Sahih</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
    <style>
      .detail-shell {
        background: var(--bg-white);
        border: 1px solid var(--line);
        border-radius: 18px;
        box-shadow: var(--shadow-soft);
        overflow: hidden;
      }

      .detail-header {
        background: linear-gradient(135deg, #eef2ff 0%, #f8fafc 100%);
        border-bottom: 1px solid var(--line);
        padding: 28px 32px;
      }

      .detail-header-top {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 16px;
        flex-wrap: wrap;
      }

      .detail-file-box {
        display: flex;
        align-items: center;
        gap: 16px;
      }

      .detail-file-icon {
        width: 58px;
        height: 58px;
        border-radius: 16px;
        background: linear-gradient(135deg, var(--indigo-600), #818cf8);
        color: #fff;
        display: grid;
        place-items: center;
        font-size: 24px;
        font-weight: 800;
      }

      .detail-file-name {
        margin: 0;
        font-size: 25px;
        letter-spacing: -0.02em;
      }

      .detail-file-meta {
        margin-top: 6px;
        color: var(--text-muted);
        font-size: 13px;
      }

      .detail-badge {
        display: inline-flex;
        align-items: center;
        padding: 8px 12px;
        border-radius: 999px;
        font-size: 12px;
        font-weight: 800;
        letter-spacing: 0.04em;
        text-transform: uppercase;
      }

      .detail-badge.success {
        background: rgba(22, 163, 74, 0.12);
        color: var(--success);
      }

      .detail-badge.danger {
        background: rgba(239, 68, 68, 0.12);
        color: var(--danger);
      }

      .detail-badge.neutral {
        background: rgba(100, 116, 139, 0.12);
        color: var(--text-main);
      }

      .detail-body {
        padding: 28px 32px 32px;
      }

      .detail-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
        gap: 18px;
        margin-bottom: 28px;
      }

      .detail-stat {
        background: #f8fafc;
        border: 1px solid var(--line);
        border-radius: 12px;
        padding: 16px 18px;
      }

      .detail-stat .label {
        display: block;
        font-size: 11px;
        letter-spacing: 0.05em;
        text-transform: uppercase;
        color: var(--text-muted);
        margin-bottom: 8px;
      }

      .detail-stat .value {
        font-size: 20px;
        font-weight: 800;
        letter-spacing: -0.02em;
      }

      .detail-summary {
        border: 1px solid var(--line);
        background: #f8fafc;
        border-radius: 12px;
        padding: 18px 20px;
        line-height: 1.7;
        color: var(--text-main);
        margin-bottom: 28px;
      }

      .detail-section-title {
        margin: 0 0 16px;
        font-size: 16px;
        letter-spacing: -0.01em;
      }

      .detail-meta-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
        gap: 12px;
      }

      .detail-meta-row {
        display: flex;
        justify-content: space-between;
        gap: 16px;
        padding: 14px 16px;
        border: 1px solid var(--line);
        border-radius: 10px;
        background: var(--bg-white);
      }

      .detail-meta-row .key {
        color: var(--text-muted);
        font-size: 12px;
        font-weight: 600;
      }

      .detail-meta-row .value {
        font-size: 13px;
        text-align: right;
        color: var(--text-main);
        word-break: break-word;
      }

      .detail-actions {
        display: flex;
        justify-content: flex-end;
        gap: 10px;
        margin-top: 28px;
        flex-wrap: wrap;
      }

      .primary-btn,
      .secondary-btn {
        border: none;
        border-radius: 10px;
        padding: 11px 18px;
        font-size: 14px;
        font-weight: 700;
        cursor: pointer;
        text-decoration: none;
        display: inline-flex;
        align-items: center;
        justify-content: center;
      }

      .primary-btn {
        background: var(--indigo-600);
        color: #fff;
      }

      .secondary-btn {
        background: #fff;
        border: 1px solid var(--line);
        color: var(--text-main);
      }

      @media (max-width: 640px) {
        .detail-header,
        .detail-body {
          padding-left: 18px;
          padding-right: 18px;
        }

        .detail-meta-row {
          flex-direction: column;
          align-items: flex-start;
        }

        .detail-meta-row .value {
          text-align: left;
        }
      }
    </style>
  </head>
  <body class="dashboard-page">
    <div class="dashboard-layout">
      <aside class="sidebar">
        <div>
          <div class="sidebar-brand">
            <div class="mini-logo">S</div>
            <span>Sahih</span>
          </div>

          <nav class="sidebar-nav" id="sidebar-nav">
            <a href="dashboard.html">
              <span class="nav-icon" aria-hidden="true">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <rect x="3" y="3" width="7" height="7" rx="1.5"></rect>
                  <rect x="14" y="3" width="7" height="7" rx="1.5"></rect>
                  <rect x="3" y="14" width="7" height="7" rx="1.5"></rect>
                  <rect x="14" y="14" width="7" height="7" rx="1.5"></rect>
                </svg>
              </span>
              Dashboard
            </a>
            <a href="upload.html">
              <span class="nav-icon" aria-hidden="true">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <path d="M12 16V4"/>
                  <path d="M7 9l5-5 5 5"/>
                  <rect x="4" y="16" width="16" height="4" rx="1.5"></rect>
                </svg>
              </span>
              Upload
            </a>
            <a href="riwayat.html" class="active">
              <span class="nav-icon" aria-hidden="true">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <path d="M3 12a9 9 0 1 0 3-6.7"></path>
                  <path d="M3 4v5h5"></path>
                  <path d="M12 7v5l3 2"></path>
                </svg>
              </span>
              Riwayat
            </a>
            <a href="profil.html">
              <span class="nav-icon" aria-hidden="true">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <circle cx="12" cy="8" r="4"></circle>
                  <path d="M4 21c0-4.4 3.6-8 8-8s8 3.6 8 8"></path>
                </svg>
              </span>
              Profil
            </a>
          </nav>
        </div>

        <div class="sidebar-bottom">
          <button id="logout-btn" class="logout-btn" type="button">
            <span class="nav-icon" aria-hidden="true">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
                <path d="M16 17l5-5-5-5"></path>
                <path d="M21 12H9"></path>
              </svg>
            </span>
            Logout
          </button>
        </div>
      </aside>

      <main class="dashboard-main">
        <header class="dashboard-header">
          <div>
            <h1>Detail Riwayat</h1>
            <p>Informasi lengkap dari hasil analisis dokumen.</p>
          </div>
        </header>

        <section class="detail-shell">
          <div class="detail-header">
            <div class="detail-header-top">
              <div class="detail-file-box">
                <div class="detail-file-icon">PDF</div>
                <div>
                  <h2 class="detail-file-name" id="detail-file-name">Memuat...</h2>
                  <div class="detail-file-meta" id="detail-file-meta">Memuat data...</div>
                </div>
              </div>
              <span class="detail-badge neutral" id="detail-status-badge">LOADING</span>
            </div>
          </div>

          <div class="detail-body">
            <div class="detail-grid">
              <div class="detail-stat">
                <span class="label">Status</span>
                <div class="value" id="detail-classification">-</div>
              </div>
              <div class="detail-stat">
                <span class="label">Persentase</span>
                <div class="value" id="detail-percent">-</div>
              </div>
              <div class="detail-stat">
                <span class="label">Tanggal</span>
                <div class="value" id="detail-date">-</div>
              </div>
              <div class="detail-stat">
                <span class="label">SHA-256</span>
                <div class="value" id="detail-hash">-</div>
              </div>
            </div>

            <div class="detail-summary" id="detail-summary">
              Memuat ringkasan hasil analisis...
            </div>

            <h3 class="detail-section-title">Metadata Dokumen</h3>
            <div class="detail-meta-grid" id="detail-metadata"></div>

            <div class="detail-actions">
              <a class="secondary-btn" href="riwayat.html">Kembali ke Riwayat</a>
              <a class="primary-btn" href="upload.html">Analisis Dokumen Baru</a>
            </div>
          </div>
        </section>
      </main>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase-config.js"></script>
    <script src="script.js"></script>
  </body>
</html>
