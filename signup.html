<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Daftar Akun - Forensa</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body class="auth-page">
    <main class="auth-layout signup-layout">
      <section class="brand-panel">
        <a
          class="brand-content brand-home-link"
          href="index.html"
          aria-label="Kembali ke landing page Forensa"
        >
          <div class="brand-logo">
            <img src="assets/logo_putih.png" alt="" />
          </div>
          <h1>Forensa</h1>
          <p>Daftar sebagai pengguna</p>
        </a>
      </section>

      <section class="auth-panel">
        <div class="auth-card signup-card fade-in-up">
          <a class="back-home-link" href="index.html">
            <span aria-hidden="true">←</span> Kembali ke halaman utama
          </a>
          <h2>Daftar Akun</h2>
          <p class="auth-note">Isi data akun Anda untuk membuat akun baru.</p>

          <form id="signup-form" class="auth-form" novalidate>
            <label class="input-group">
              <span class="input-icon" aria-hidden="true">
                <svg
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2"
                >
                  <circle cx="12" cy="8" r="4"></circle>
                  <path d="M4 21c0-4.4 3.6-8 8-8s8 3.6 8 8"></path>
                </svg>
              </span>
              <input
                type="text"
                name="fullName"
                placeholder="Nama lengkap"
                required
              />
            </label>

            <label class="input-group">
              <span class="input-icon" aria-hidden="true">
                <svg
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2"
                >
                  <path d="M4 6h16v12H4z"></path>
                  <path d="M4 7l8 6 8-6"></path>
                </svg>
              </span>
              <input
                type="email"
                name="email"
                placeholder="Email pribadi"
                required
              />
            </label>

            <label class="input-group">
              <span class="input-icon" aria-hidden="true">
                <svg
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2"
                >
                  <rect x="5" y="11" width="14" height="10" rx="2"></rect>
                  <path d="M8 11V8a4 4 0 0 1 8 0v3"></path>
                </svg>
              </span>
              <input
                type="password"
                name="password"
                placeholder="Kata sandi"
                required
                minlength="8"
              />
            </label>

            <label class="input-group">
              <span class="input-icon" aria-hidden="true">
                <svg
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2"
                >
                  <rect x="5" y="11" width="14" height="10" rx="2"></rect>
                  <path d="M8 11V8a4 4 0 0 1 8 0v3"></path>
                </svg>
              </span>
              <input
                type="password"
                name="confirmPassword"
                placeholder="Konfirmasi kata sandi"
                required
                minlength="8"
              />
            </label>

            <label class="checkbox-row">
              <input type="checkbox" name="terms" required />
              <span
                >Saya menyetujui Syarat Layanan &amp; Kebijakan Privasi</span
              >
            </label>

            <button type="submit" class="primary-btn">Daftar Akun</button>

            <p class="form-footer">
              Sudah punya akun?
              <a href="login.html" class="text-link">Masuk</a>
            </p>
          </form>
        </div>
      </section>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="supabase-config.js"></script>
    <script src="script.js"></script>
  </body>
</html>
