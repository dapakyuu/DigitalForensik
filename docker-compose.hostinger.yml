services:
  api:
    build:
      context: https://github.com/dapakyuu/DigitalForensik.git#main
      dockerfile: Dockerfile.api
    restart: unless-stopped
    environment:
      SUPABASE_URL: ${SUPABASE_URL}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY}
    expose:
      - "8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/', timeout=5)"
      interval: 30s
      timeout: 10s
      start_period: 120s
      retries: 5
    networks:
      - sahih-network

  frontend:
    build:
      context: https://github.com/dapakyuu/DigitalForensik.git#main
      dockerfile: Dockerfile.frontend
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    expose:
      - "80"
    labels:
      - "traefik.enable=true"
      - "traefik.http.services.forensa.loadbalancer.server.port=80"
      - "traefik.http.routers.forensa.rule=Host(`forensa.tech`) || Host(`www.forensa.tech`)"
      - "traefik.http.routers.forensa.entrypoints=websecure"
      - "traefik.http.routers.forensa.service=forensa"
      - "traefik.http.routers.forensa.tls=true"
      - "traefik.http.routers.forensa.tls.certresolver=letsencrypt"
      - "traefik.http.routers.forensa-http.rule=Host(`forensa.tech`) || Host(`www.forensa.tech`)"
      - "traefik.http.routers.forensa-http.entrypoints=web"
      - "traefik.http.routers.forensa-http.service=forensa"
      - "traefik.http.routers.forensa-http.middlewares=forensa-https-redirect"
      - "traefik.http.middlewares.forensa-https-redirect.redirectscheme.scheme=https"
      - "traefik.http.middlewares.forensa-https-redirect.redirectscheme.permanent=true"
    # Akses IP sementara untuk rollback. Hapus setelah HTTPS terverifikasi.
    ports:
      - "8080:80"
    networks:
      - sahih-network

networks:
  sahih-network:
    driver: bridge
